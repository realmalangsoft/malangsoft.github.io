<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>

  <!-- Pure CSS Theme Toggle Switch -->
  <input type="checkbox" id="theme-toggle" hidden>

  <!-- Site Content Wrapper -->
  <div class="site-wrapper">
    <div class="container">
      <!-- 헤더 -->
      <header class="header">
        <a href="{{ '/' | relative_url }}" class="logo">
          <img src="{{ '/logo.png' | relative_url }}" alt="RealmalangSoft Logo" class="logo-img">
          <span>RealmalangSoft</span>
        </a>
        
        <div class="nav-right">
          <nav>
            <ul class="nav-links">
              <li><a href="{{ '/' | relative_url }}#recent">최근 페이지</a></li>
              <li><a href="{{ '/' | relative_url }}#about">소개</a></li>
              <li><a href="{{ '/' | relative_url }}#projects">프로젝트</a></li>
              <li><a href="{{ '/' | relative_url }}#contact">연락처</a></li>
            </ul>
          </nav>
          <!-- ☀️ / 🌙 다크-라이트모드 전환 버튼 -->
          <label for="theme-toggle" class="theme-btn" title="테마 전환">
            <span class="icon-sun">🌙 Dark</span>
            <span class="icon-moon">☀️ Light</span>
          </label>
        </div>
      </header>

      <!-- 페이지 메인 본문 -->
      <main class="main-content">
        {{ content }}
      </main>

      <!-- 푸터 -->
      <footer class="footer">
        <p>&copy; {{ 'now' | date: "%Y" }} RealmalangSoft. All rights reserved.</p>
      </footer>
    </div>
  </div>

</body>
</html>
