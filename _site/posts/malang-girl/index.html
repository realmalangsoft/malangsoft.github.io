<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>말랑소녀</title>
  <link rel="stylesheet" href="/style.css">
  <!-- 페이지 로딩 전 테마 복원 (화면 깜빡임 방지) -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    })();
  </script>
</head>
<body>

  <!-- Site Content Wrapper -->
  <div class="site-wrapper">
    <div class="container">
      <!-- 헤더 -->
      <header class="header">
        <a href="/" class="logo">
          <img src="/assets/images/logo.png" alt="malangsoft Logo" class="logo-img">
          <span>malangsoft</span>
        </a>
        
        <div class="nav-right">
          <nav>
            <ul class="nav-links">
              <li><a href="/about/">About</a></li>
              <li><a href="/projects/">Projects</a></li>
              <li><a href="/recent/">Posts</a></li>
              <li><a href="/contact/">Contact</a></li>
            </ul>
          </nav>
          <!-- ☀️ / 🌙 다크-라이트모드 지속 전환 버튼 -->
          <button type="button" id="theme-btn" class="theme-btn" onclick="toggleTheme()" title="테마 전환">
            <span id="theme-btn-text">🌙 Dark</span>
          </button>
        </div>
      </header>

      <!-- 페이지 메인 본문 -->
      <main class="main-content">
        <article class="post-container">
  <header class="post-header">
    <h1 class="post-title">말랑소녀</h1>
    <div class="post-meta">2026년 07월 28일</div>
  </header>

  <div class="post-content">

  </div>

  <div style="margin-top: 3rem;">
    <a href="/" class="project-link">← 메인 페이지로 돌아가기</a>
  </div>
</article>

      </main>


    </div>
  </div>

  <!-- 테마 저장 및 토글 스크립트 -->
  <script>
    function updateBtnText(isDark) {
      const btnText = document.getElementById('theme-btn-text');
      if (btnText) {
        btnText.textContent = isDark ? '☀️ Light' : '🌙 Dark';
      }
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      let isDark = currentTheme === 'dark' || (!currentTheme && systemDark);

      const newTheme = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateBtnText(!isDark);
    }

    // 초기 버튼 텍스트 동기화
    (function() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      let isDark = currentTheme === 'dark' || (!currentTheme && systemDark);
      updateBtnText(isDark);
    })();
  </script>
</body>
</html>
